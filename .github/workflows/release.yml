# Every merge to main publishes a release (ADR-28): the check job tests, then
# the release job builds a DMG signed with the "Pankapture Development"
# identity and tags it with the next version (scripts/next-version.sh). Pull
# requests run the check job only: tests and a DMG build, no secrets, nothing
# published. Docs-only changes don't release, and on pull requests the check
# job passes without building so it can stay a required check (ADR-29).
#
# Secrets live in the "release" environment, which only main can use
# (set once with `make ci-secrets` on the Mac that has the identity):
#   PK_SIGNING_P12_BASE64    the identity as a base64 .p12
#   PK_SIGNING_P12_PASSWORD  its password
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases run one at a time, in merge order; PR runs replace older runs.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version

      - name: Detect code changes
        id: changes
        run: |
          CODE=true
          if [[ "$EVENT" == "pull_request" ]]; then
            # HEAD is the PR merged into its base; the first parent is the base.
            CODE=false
            while IFS= read -r FILE; do
              [[ "$FILE" == docs/* || "$FILE" == *.md ]] || CODE=true
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          [[ "$CODE" == true ]] || echo "Docs-only change; skipping the build."

      - name: Select the newest Xcode
        if: steps.changes.outputs.code == 'true'
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Test
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 20
        run: |
          # Tests normally finish in about a minute. If they're still running
          # after 10, print every thread's stack from the test process, so a
          # hang names the call it's stuck in, then fail.
          swift build --build-tests
          LOG="$RUNNER_TEMP/test.log"
          swift test --skip-build > "$LOG" 2>&1 &
          TEST=$!
          tail -n +1 -f "$LOG" &
          TAIL=$!
          for _ in $(seq 60); do
            kill -0 "$TEST" 2>/dev/null || break
            sleep 10
          done
          if kill -0 "$TEST" 2>/dev/null; then
            echo "::error::Tests still running after 10 minutes; dumping thread stacks."
            for PID in $(pgrep -f 'swiftpm-testing-helper|xctest'); do
              echo "=== $PID: $(ps -o command= -p "$PID")"
              # spindump takes kernel stack snapshots, so it works on the
              # signed test helper that a debugger can't attach to.
              sudo spindump "$PID" 5 -noFile 2>&1 || sample "$PID" 3 2>&1 || true
            done
            kill "$TEST" 2>/dev/null; pkill -f swiftpm-testing-helper || true
            STATUS=1
          else
            wait "$TEST"; STATUS=$?
          fi
          sleep 1; kill "$TAIL" 2>/dev/null || true
          exit "$STATUS"

      - name: Build the disk image (dry run)
        if: steps.changes.outputs.code == 'true' && env.EVENT == 'pull_request'
        run: |
          PK_VERSION="$(bash scripts/next-version.sh)" bash scripts/package-dmg.sh
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Pankapture.app/Contents/Info.plist

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Import the signing identity
        env:
          P12_BASE64: ${{ secrets.PK_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.PK_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::error::The PK_SIGNING_P12_BASE64 secret is missing. Run 'make ci-secrets' on the Mac with the signing identity."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
